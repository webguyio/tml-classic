<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Display themed WordPress login, registration, and lost password forms on any front-end page using a shortcode.">
	<meta name="keywords" content="wordpress, plugin, login, registration, lost password, themed, shortcode">
	<meta name="theme-color" content="#1a1f2e">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://webguyio.github.io/tml-classic/">
	<meta property="og:title" content="TML Classic">
	<meta property="og:description" content="Display themed WordPress login, registration, and lost password forms on any front-end page using a shortcode.">
	<meta property="og:image" content="https://webguyio.github.io/tml-classic/icon.png">
	<meta name="twitter:image" content="https://webguyio.github.io/tml-classic/icon.png">
	<meta name="twitter:card" content="summary_large_image">

	<title>TML Classic | WordPress Plugin</title>

	<link rel="icon" href="icon.svg" type="image/svg+xml">
	<link rel="canonical" href="https://webguyio.github.io/tml-classic/">

	<script type="application/ld+json">
	{
		"@context": "https://schema.org/",
		"@type": "SoftwareApplication",
		"name": "TML Classic",
		"url": "https://webguyio.github.io/tml-classic/",
		"description": "Display themed WordPress login, registration, and lost password forms on any front-end page using a shortcode.",
		"applicationCategory": "WebApplication",
		"operatingSystem": "WordPress"
	}
	</script>

	<style>
		*, *::before, *::after {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		body {
			background: #1e1428;
			color: #d4c9a8;
			font-family: "Georgia Pro", Georgia, "Times New Roman", serif;
			font-size: 18px;
			line-height: 1.7;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			padding: 3rem 1.5rem;
		}

		main {
			max-width: 600px;
			width: 100%;
			text-align: center;
		}

		#logo {
			width: 120px;
			height: 120px;
			margin-bottom: 1.5rem;
		}

		h1 {
			font-size: 2rem;
			font-weight: normal;
			color: #f0e8d0;
			margin-bottom: 1.5rem;
			letter-spacing: 0.02em;
		}

		p {
			color: #b0a688;
			text-wrap: balance;
			margin-bottom: 1.25rem;
		}

		p:last-of-type {
			margin-bottom: 2rem;
		}

		a {
			color: #c8a84b;
			text-decoration: none;
		}

		a:hover {
			text-decoration: underline;
		}

		.button {
			display: inline-block;
			background: #c8a84b;
			color: #1a1f2e;
			font-family: inherit;
			font-size: 1rem;
			padding: 0.75rem 2.5rem;
			border-radius: 4px;
			text-decoration: none;
			letter-spacing: 0.03em;
			transition: background 0.15s;
		}

		.button:hover {
			background: #e0bc60;
			text-decoration: none;
		}

		footer {
			margin-top: 3rem;
			font-size: 0.85rem;
			color: #5a5540;
		}
	</style>

</head>

<body>

	<a href="#content" class="skip-link" style="position:absolute;left:-9999px;">Skip to content</a>

	<main id="content">

		<img src="icon.svg" alt="TML Classic" id="logo">

		<h1>TML Classic</h1>

		<p>Display themed WordPress login, registration, and lost password forms on any front-end page using a shortcode.</p>

		<p>TML Classic is a fork of an older branch of <a href="https://thememylogin.com/">Theme My Login</a>, preserved for sites that prefer the classic approach.</p>

		<a href="tml-classic.zip" class="button">Download</a>

	</main>

	<footer id="footer">

		By <a href="https://webguy.io/">Web Guy</a> | <a href="https://github.com/webguyio/tml-classic">GitHub</a>

	</footer>

</body>
