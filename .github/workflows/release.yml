name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from plugin header
        id: version
        run: |
          VERSION=$(grep -m1 "^Version:" tml-classic.php | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build zip
        run: |
          zip -r docs/tml-classic.zip . \
            --exclude "*.git*" \
            --exclude ".gitignore" \
            --exclude "docs/*"

      - name: Update updates.json
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          jq \
            --arg v "$VERSION" \
            --arg d "$TODAY" \
            '.version = $v | .last_updated = $d' \
            docs/updates.json > docs/updates.json.tmp
          mv docs/updates.json.tmp docs/updates.json

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tml-classic.zip docs/updates.json
          git diff --staged --quiet || git commit -m "Build ${{ steps.version.outputs.version }}"
          git push