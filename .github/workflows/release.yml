name: Release

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version from plugin header
        id: version
        run: |
          VERSION=$(grep -m1 "^Version:" tml-classic.php | awk '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          CHANGELOG=$(awk '/^## Changelog/{found=1; next} found && /^## /{exit} found{print}' readme.md \
            | sed '/^$/d' \
            | sed 's/^### \(.*\)/<h4>\1<\/h4>/' \
            | sed 's/^\* \(.*\)/<li>\1<\/li>/' \
            | sed 's/\[\([^]]*\)\](\([^)]*\))/<a href="\2">\1<\/a>/g' \
            | tr -d '\n')
          echo "changelog=$CHANGELOG" >> $GITHUB_OUTPUT

      - name: Update updates.json
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          jq --tab \
            --arg v "$VERSION" \
            --arg d "$TODAY" \
            --arg c "${{ steps.changelog.outputs.changelog }}" \
            '.version = $v | .last_updated = $d | .changelog = $c' \
            docs/updates.json > docs/updates.json.tmp
          mv docs/updates.json.tmp docs/updates.json
          truncate -s -1 docs/updates.json

      - name: Build zip
        run: |
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('docs/tml-classic.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ['.git', '.github', 'docs']]
              files = [f for f in files if f != '.gitignore']
              for file in files:
                path = os.path.join(root, file)
                zf.write(path, os.path.join('tml-classic', path[2:]))
          "

      - name: Commit build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tml-classic.zip docs/updates.json
          git diff --staged --quiet || git commit -m "Build ${{ steps.version.outputs.version }}"
          git push